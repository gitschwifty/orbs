[package]
name = "orbs-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"

[[bin]]
name = "orbs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
orbs = { path = ".." }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
